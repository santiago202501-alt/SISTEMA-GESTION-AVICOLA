<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/layout :: head(${module.title})}"></head><body><div th:replace="~{fragments/layout :: nav}"></div><div th:replace="~{fragments/layout :: sidebar}"></div><main class="content"><div class="page-head"><div><span class="eyebrow">Módulo</span><h1 th:text="${module.title}">Módulo</h1><p class="muted">Gestiona y consulta los registros de tu operación.</p></div><a class="btn primary" th:if="${canCreate}" th:href="@{'/modules/' + module.key + '/new'}">+ Nuevo registro</a></div><div class="table-card"><div class="table-wrap"><table><thead><tr th:if="${!rows.isEmpty()}"><th th:each="e : ${rows[0].entrySet()}" th:text="${e.key}">campo</th><th>Acciones</th></tr><tr th:if="${rows.isEmpty()}"><th>Sin registros</th></tr></thead><tbody><tr th:each="row : ${rows}"><td th:each="e : ${row.entrySet()}" th:text="${e.value}">valor</td><td class="actions"><a class="btn small" th:if="${canEdit}" th:href="@{'/modules/' + module.key + '/' + row['id'] + '/edit'}">Editar</a><form th:if="${canDelete}" th:action="@{'/modules/' + module.key + '/' + row['id'] + '/delete'}" method="post"><button class="btn small danger" onclick="return confirm('¿Eliminar este registro?')">Eliminar</button></form></td></tr><tr th:if="${rows.isEmpty()}"><td>Este cliente aún no tiene datos. Los nuevos registros comenzarán desde cero.</td></tr></tbody></table></div></div></main></body></html>
