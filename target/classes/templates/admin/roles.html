<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Roles y permisos')}"></head><body><div th:replace="~{fragments/layout :: nav}"></div><div th:replace="~{fragments/layout :: sidebar}"></div><main class="content"><div class="page-head"><div><span class="eyebrow">Seguridad</span><h1>Roles y permisos</h1><p class="muted">Administra exactamente qué puede hacer cada rol.</p></div></div><div class="cards"><div class="stat-card" th:each="r:${roles}"><div><span>Rol</span><strong th:text="${r.nombre}"></strong><p class="muted" th:text="${r.descripcion}"></p></div></div></div><div class="form-card" style="margin-top:18px"><h3>Crear rol</h3><form action="/admin/roles/save" method="post" class="grid-form"><input type="hidden" name="id" value="0"><label>Nombre<input name="nombre" required></label><label>Descripción<input name="descripcion"></label><div class="form-actions"><button class="btn primary">Crear rol</button></div></form></div><div class="form-card" style="margin-top:18px" th:each="r:${roles}"><h3 th:text="${'Permisos de ' + r.nombre}"></h3><form method="post" th:action="@{'/admin/roles/' + r.id + '/permisos'}" class="perm-grid"><label th:each="p:${permisos}" class="perm"><input type="checkbox" name="permisoIds" th:value="${p.id}" th:checked="${rolePerms[r.id] != null and rolePerms[r.id].contains(p.id)}"><span th:text="${p.nombre}"></span></label><button class="btn primary">Guardar permisos</button></form></div></main></body></html>
