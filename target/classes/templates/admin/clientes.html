<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Clientes')}"></head><body><div th:replace="~{fragments/layout :: nav}"></div><div th:replace="~{fragments/layout :: sidebar}"></div><main class="content"><div class="page-head"><div><span class="eyebrow">Administración</span><h1>Clientes</h1><p class="muted">Cada cliente es un espacio independiente de datos.</p></div></div><div class="table-card"><table><thead><tr><th>ID</th><th>Empresa</th><th>NIT</th><th>Email</th><th>Teléfono</th><th>Activo</th><th></th></tr></thead><tbody><tr th:each="c:${clients}"><td th:text="${c.id}"></td><td th:text="${c.nombre}"></td><td th:text="${c.nit}"></td><td th:text="${c.email}"></td><td th:text="${c.telefono}"></td><td th:text="${c.activo}"></td><td><a class="btn small" th:href="@{'/admin/clientes/' + c.id + '/edit'}">Editar</a> <form th:action="@{'/admin/clientes/' + c.id + '/delete'}" method="post"><button class="btn small danger">Eliminar</button></form></td></tr></tbody></table></div><div class="form-card" style="margin-top:18px"><h3>Nuevo cliente</h3><form action="/admin/clientes/save" method="post" class="grid-form"><input type="hidden" name="id" th:value="${editClient != null ? editClient.id : 0}"><label>Empresa<input name="nombre" th:value="${editClient != null ? editClient.nombre : ''}" required></label><label>NIT<input name="nit" th:value="${editClient != null ? editClient['nit'] : ''}"></label><label>Teléfono<input name="telefono" th:value="${editClient != null ? editClient['telefono'] : ''}"></label><label>Email<input type="email" name="email" th:value="${editClient != null ? editClient['email'] : ''}"></label><label>Dirección<input name="direccion" th:value="${editClient != null ? editClient['direccion'] : ''}"></label><label class="checkline">Activo <input type="checkbox" name="activo" value="1" checked></label><div class="form-actions"><button class="btn primary">Guardar</button></div></form></div></main></body></html>
