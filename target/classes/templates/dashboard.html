<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/layout :: head('Dashboard')}"></head><body><div th:replace="~{fragments/layout :: nav}"></div><div th:replace="~{fragments/layout :: sidebar}"></div><main class="content"><div class="page-head"><div><span class="eyebrow">Panel principal</span><h1>Hola, <span th:text="${user.nombreCompleto}">Usuario</span> 👋</h1><p class="muted">Resumen de la información de tu operación en SIGA.</p></div><span class="role-badge" th:text="${user.rol}">cliente</span></div><div class="cards"><a th:each="m : ${modules}" class="stat-card" th:href="@{'/modules/' + m.key}"><div class="stat-icon" th:text="${m.icon}">•</div><div><span th:text="${m.title}">Módulo</span><strong th:text="${counts[m.key]}">0</strong></div></a></div><section class="info-panel"><h3>Tu información está aislada por cliente</h3><p>Los usuarios con rol Cliente y Ojeador solo consultan la información correspondiente a su empresa. El Administrador puede gestionar todos los clientes.</p></section></main></body></html>
