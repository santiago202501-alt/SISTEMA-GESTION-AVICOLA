<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registro · SIGA Avícola</title><link rel="stylesheet" href="/css/siga.css"></head>
<body class="auth-page"><div class="auth-shell"><div class="auth-brand"><div class="brand-mark big">S</div><h1>SIGA <span>Avícola</span></h1><p>Registra una nueva empresa cliente.</p></div><div class="auth-card wide-card"><h2>Crear cliente</h2><p class="muted">El registro crea un cliente independiente con datos propios.</p><div class="alert error" th:if="${error}" th:text="${error}"></div><form method="post" action="/register" class="grid-form"><label>Empresa<input name="empresa" required></label><label>Nombre completo<input name="nombre_completo" required></label><label>Documento<input name="documento" required></label><label>Teléfono<input name="telefono"></label><label>Correo<input type="email" name="email" required></label><label>Contraseña<input type="password" name="password" minlength="6" required></label><div class="form-actions"><button class="btn primary" type="submit">Crear cuenta</button><a class="btn ghost" href="/login">Volver</a></div></form></div></div></body></html>
