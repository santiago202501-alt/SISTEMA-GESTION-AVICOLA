<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head(${module.title})}"></head><body><div th:replace="~{fragments/layout :: nav}"></div><div th:replace="~{fragments/layout :: sidebar}"></div><main class="content"><div class="page-head"><div><span class="eyebrow">SIGA</span><h1 th:text="${row['id']} == null ? 'Nuevo · ' + ${module.title} : 'Editar · ' + ${module.title}">Formulario</h1></div><a class="btn ghost" th:href="@{'/modules/' + module.key}">Volver</a></div><div class="form-card"><form method="post" th:action="@{'/modules/' + module.key + '/save'}" class="grid-form"><input type="hidden" name="id" th:value="${row['id'] ?: 0}"><label th:each="f : ${module.fields}"><span th:text="${f.label}">Campo</span><textarea th:if="${f.type == 'textarea'}" th:name="${f.name}" th:text="${row[f.name]}" th:required="${f.required}"></textarea><select th:if="${f.type.startsWith('select:')}" th:name="${f.name}" th:required="${f.required}"><option th:each="op : ${#strings.arraySplit(f.type.substring(7),'|')}" th:value="${op}" th:text="${op}" th:selected="${row[f.name] == op}"></option></select><input th:if="${f.type != 'textarea' and !f.type.startsWith('select:') and f.type != 'checkbox'}" th:type="${f.type}" th:name="${f.name}" th:value="${row[f.name]}" th:required="${f.required}"><span class="checkline" th:if="${f.type == 'checkbox'}"><input type="checkbox" th:name="${f.name}" value="1" th:checked="${row[f.name] == 1 or row[f.name] == true}"> Activo</span></label><div class="form-actions"><button class="btn primary" type="submit">Guardar</button><a class="btn ghost" th:href="@{'/modules/' + module.key}">Cancelar</a></div></form></div></main></body></html>
