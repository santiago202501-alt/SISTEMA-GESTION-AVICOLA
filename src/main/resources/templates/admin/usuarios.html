<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Usuarios')}"></head><body><div th:replace="~{fragments/layout :: nav}"></div><div th:replace="~{fragments/layout :: sidebar}"></div><main class="content"><div class="page-head"><div><span class="eyebrow">Administración</span><h1>Usuarios</h1></div></div><div class="table-card"><table><thead><tr><th>ID</th><th>Nombre</th><th>Email</th><th>Rol</th><th>Cliente</th><th>Activo</th><th>Acciones</th></tr></thead><tbody><tr th:each="u:${userRows}"><td th:text="${u.id}"></td><td th:text="${u.nombre_completo}"></td><td th:text="${u.email}"></td><td th:text="${u.rol}"></td><td th:text="${u.cliente}"></td><td th:text="${u.activo}"></td><td><a class="btn small" th:href="@{'/admin/usuarios/' + u.id + '/edit'}">Editar</a> <form th:action="@{'/admin/usuarios/' + u.id + '/delete'}" method="post"><button class="btn small danger" onclick="return confirm('¿Eliminar usuario?')">Eliminar</button></form></td></tr></tbody></table></div><div class="form-card" style="margin-top:18px"><h3>Crear usuario</h3><form action="/admin/usuarios/save" method="post" class="grid-form"><input type="hidden" name="id" th:value="${editUser != null ? editUser.id : 0}"><label>Nombre<input name="nombre_completo" th:value="${editUser != null ? editUser['nombre_completo'] : ''}" required></label><label>Documento<input name="documento" th:value="${editUser != null ? editUser['documento'] : ''}" required></label><label>Email<input type="email" name="email" th:value="${editUser != null ? editUser['email'] : ''}" required></label><label>Teléfono<input name="telefono"></label><label>Contraseña<input type="password" name="password" minlength="6" th:required="${editUser == null}"></label><label>Rol<select name="rol_id"><option th:each="r:${roles}" th:value="${r.id}" th:text="${r.nombre}" th:selected="${editUser != null and editUser.rol_id == r.id}"></option></select></label><label>Cliente<select name="cliente_id"><option th:each="c:${clientes}" th:value="${c.id}" th:text="${c.nombre}" th:selected="${editUser != null and editUser.cliente_id == c.id}"></option></select></label><label class="checkline">Activo <input type="checkbox" name="activo" value="1" checked></label><div class="form-actions"><button class="btn primary">Guardar</button></div></form></div></main></body></html>
